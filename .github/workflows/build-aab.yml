name: Build Signed Android App Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - 'English_Word_Trainer_GitHub_Build_READY.zip'
      - '.github/workflows/build-aab.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q English_Word_Trainer_GitHub_Build_READY.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/upload-key.jks

      - name: Force minSdkVersion and targetSdkVersion
        run: |
          # فرض الإصدارات المطلوبة في جميع ملفات build.gradle
          find source -name "build.gradle" -exec sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' {} +
          find source -name "build.gradle" -exec sed -i 's/minSdk [0-9]*/minSdk 24/g' {} +
          find source -name "build.gradle" -exec sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 36/g' {} +
          find source -name "build.gradle" -exec sed -i 's/targetSdk [0-9]*/targetSdk 36/g' {} +

      - name: Build Unsigned AAB
        run: |
          # تمرير الإصدارات كوسائط لـ Gradle لضمان التطبيق
          gradle -p source :app:bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/upload-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }} \
            -Pandroid.injected.build.api=36 \
            -PtargetSdkVersion=36 \
            -PminSdkVersion=24

      - name: Sign AAB
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore $GITHUB_WORKSPACE/upload-key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            source/app/build/outputs/bundle/release/app-release.aab \
            ${{ secrets.KEY_ALIAS }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: English-Word-Trainer-AAB
          path: source/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
