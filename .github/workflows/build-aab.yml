name: Build Signed Android App Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - 'English_Word_Trainer_GitHub_Build_READY.zip'
      - '.github/workflows/build-aab.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q English_Word_Trainer_GitHub_Build_READY.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $GITHUB_WORKSPACE/upload-key.jks

      - name: Force minSdkVersion to 24
        run: |
          # البحث في جميع ملفات build.gradle وتحديث إصدار الأندرويد الأدنى إلى 24
          find source -name "build.gradle" -exec sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' {} +
          find source -name "build.gradle" -exec sed -i 's/minSdk [0-9]*/minSdk 24/g' {} +

      - name: Build Unsigned AAB
        run: |
          gradle -p source :app:bundleRelease --no-daemon

      - name: Sign AAB
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore $GITHUB_WORKSPACE/upload-key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            source/app/build/outputs/bundle/release/app-release.aab \
            ${{ secrets.KEY_ALIAS }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: English-Word-Trainer-AAB
          path: source/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
