
name: Build Android App Bundle

on:
  workflow_dispatch:
  push:
    paths:
      - 'English_Word_Trainer_GitHub_Build_READY.zip'
      - '.github/workflows/build-aab.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q English_Word_Trainer_GitHub_Build_READY.zip -d source

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build AAB
        run: gradle -p source :app:bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: English-Word-Trainer-AAB
          path: source/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
